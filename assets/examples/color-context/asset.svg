<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 140 360" width="140" height="360" role="img" aria-labelledby="title description">
  <title id="title">Chromosome and DNA scientific illustration</title>
  <desc id="description">Editable chromosome-to-DNA schematic. Warm muted gold; transparent canvas. The upper oval is an abstract collection field, not an intact nuclear membrane. Red marks are illustrative regions, not specific genomic coordinates. Not to scale.</desc>
  <defs>
    <linearGradient id="chromatid-gold" x1="0%" y1="0%" x2="100%" y2="25%">
      <stop offset="0.00%" stop-color="#84A9C0" data-stop-role="body_shadow" />
      <stop offset="33.33%" stop-color="#91B2C8" data-stop-role="body" />
      <stop offset="66.67%" stop-color="#9DBBCF" data-stop-role="body_light" />
      <stop offset="100.00%" stop-color="#91B2C8" data-stop-role="body" />
    </linearGradient>
    <linearGradient id="chromatid-gold-right" x1="0%" y1="0%" x2="100%" y2="25%">
      <stop offset="0.00%" stop-color="#84A9C0" data-stop-role="body_shadow" />
      <stop offset="33.33%" stop-color="#9DBBCF" data-stop-role="body_light" />
      <stop offset="66.67%" stop-color="#91B2C8" data-stop-role="body" />
      <stop offset="100.00%" stop-color="#84A9C0" data-stop-role="body_shadow" />
    </linearGradient>
    <linearGradient id="dna-front" x1="169" y1="820" x2="267" y2="1210" gradientUnits="userSpaceOnUse">
      <stop offset="0.00%" stop-color="#84A9C0" data-stop-role="body_shadow" />
      <stop offset="50.00%" stop-color="#9DBBCF" data-stop-role="body_light" />
      <stop offset="100.00%" stop-color="#91B2C8" data-stop-role="body" />
    </linearGradient>
    <linearGradient id="dna-back" x1="169" y1="820" x2="267" y2="1210" gradientUnits="userSpaceOnUse">
      <stop offset="0.00%" stop-color="#84A9C0" data-stop-role="body_shadow" />
      <stop offset="50.00%" stop-color="#B8C8D0" data-stop-role="detail" />
      <stop offset="100.00%" stop-color="#B8C8D0" data-stop-role="muted" />
    </linearGradient>
    <radialGradient id="nuclear-field" cx="42%" cy="38%" r="69%">
      <stop offset="0.00%" stop-color="#E8F0F4" data-stop-role="field" />
      <stop offset="50.00%" stop-color="#E8F0F4" data-stop-role="field" />
      <stop offset="100.00%" stop-color="#B8C8D0" data-stop-role="muted" />
    </radialGradient>
  </defs>
  <g id="artwork" transform="translate(-130 -395)">
    <g id="enlarged-chromosome">
      <g id="sister-chromatid-left">
        <path d="M 191 547 C 173 524 156 482 152 448 C 149 427 152 410 164 410 C 177 410 184 423 181 446 C 178 481 183 520 200 547 C 186 580 182 620 180 658 C 179 688 182 721 171 733 C 160 746 145 739 145 722 C 145 675 153 612 174 568 C 179 557 185 550 191 547 Z" fill="url(#chromatid-gold)" stroke="#5F91AF" stroke-width="1.25" stroke-linejoin="round" data-stroke-role="outline" />
        <path d="M 162 424 C 157 452 167 494 180 520" fill="none" stroke="#DCE8EF" stroke-width="3.2" stroke-linecap="round" opacity=".44" data-stroke-role="highlight" />
        <path d="M 176 584 C 162 625 156 683 156 714" fill="none" stroke="#DCE8EF" stroke-width="3.5" stroke-linecap="round" opacity=".44" data-stroke-role="highlight" />
      </g>
      <g id="sister-chromatid-right">
        <path d="M 191 547 C 173 524 156 482 152 448 C 149 427 152 410 164 410 C 177 410 184 423 181 446 C 178 481 183 520 200 547 C 186 580 182 620 180 658 C 179 688 182 721 171 733 C 160 746 145 739 145 722 C 145 675 153 612 174 568 C 179 557 185 550 191 547 Z" transform="translate(400 0) scale(-1 1)" fill="url(#chromatid-gold-right)" stroke="#5F91AF" stroke-width="1.25" stroke-linejoin="round" data-stroke-role="outline" />
        <path d="M 235 424 C 242 446 234 490 220 520" fill="none" stroke="#DCE8EF" stroke-width="3.1" stroke-linecap="round" opacity=".34" data-stroke-role="highlight" />
        <path d="M 176 584 C 162 625 156 683 156 714" fill="none" stroke="#DCE8EF" stroke-width="3.5" stroke-linecap="round" opacity=".25" transform="translate(400 0) scale(-1 1)" data-stroke-role="highlight" />
      </g>
      <g id="centromere">
        <ellipse cx="200" cy="549" rx="12.4" ry="9.1" fill="#84A9C0" transform="rotate(-13 200 549)" data-fill-role="body_shadow" />
        <path d="M 191 545 Q 201 537 208 546" fill="none" stroke="#DCE8EF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" data-stroke-role="highlight" />
      </g>
    </g>
  </g>
</svg>
