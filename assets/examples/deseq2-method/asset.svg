  <title>DESeq2: model inputs and coefficient testing</title>
  <desc>Bounded high-level input/dependency overview of the original 2014 paper. Raw counts remain the response of the NB GLM; size factors enter the mean model. The dispersion-estimation node includes trend sharing and the outlier exception. Independent filtering, multiple-testing correction, full algorithm iteration, diagnostics, and current software defaults are outside this module. Agent inspected the selected full-text Results and Materials and methods sections from an open-access primary paper. This is an original schematic of those passages, not an experimental result or a complete executable protocol.</desc>
