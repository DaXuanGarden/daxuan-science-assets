      <path d="M 73 146 C 83 167 102 179 121 183 M 153 181 C 166 188 184 190 202 189 M 236 184 C 250 180 259 176 266 172" fill="none" stroke="#F2E0AD" stroke-width="2" stroke-linecap="round" data-stroke-role="highlight"/>
    </g>
  </g>
</svg>
