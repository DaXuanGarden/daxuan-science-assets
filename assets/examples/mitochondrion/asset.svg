  <title id="title">Generic mitochondrion schematic</title>
  <desc id="desc">A generic organelle illustration with outer membrane and folded inner membrane; not to scale, not a species-specific structure.</desc>
  <defs>
    <linearGradient id="outer-gold" x1="0%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#E3C98A" data-stop-role="body_light"/>
      <stop offset="100%" stop-color="#D4B66C" data-stop-role="body"/>
    </linearGradient>
  </defs>
  <g id="mitochondrion" transform="rotate(-16 180 135)">
    <g id="outer-membrane">
      <path d="M 40 135 C 39 91 87 59 160 58 C 237 53 313 82 320 130 C 327 176 273 207 196 212 C 121 218 47 194 40 145 Z" fill="url(#outer-gold)" stroke="#AC8E4C" stroke-width="2.2" data-stroke-role="outline"/>
